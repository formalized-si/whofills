name: Bug
description: Something in the library, the CLI or the bench does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest page, server code or command that shows it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: whofills version or commit, Node.js version, browser.
